name: Make Changes and Push Code
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: 'Create env file'
      run: |
            touch .env
            echo POSTGRES_USER=${{secrets.POSTGRES_USER}} >> .env
            echo POSTGRES_PASSWORD=${{secrets.POSTGRES_PASSWORD}} >> .env
            echo POSTGRES_DATABASE=${{secrets.POSTGRES_DATABASE}} >> .env
            echo POSTGRES_URL=${{secrets.POSTGRES_URL}} >> .env
            echo PORT=${{secrets.PORT}} >> .env
            echo RESEND_API_KEY=${{secrets.RESEND_API_KEY}} >> .env
            echo JWT_SECRET=${{secrets.JWT_SECRET}} >> .env
            echo JWT_EXPIRATION_TIME_IN_MINUTES="43200" >> .env
            echo OTP_RESEND_TIME_IN_SECONDS='30' >> .env
            echo OTP_EXPIRE_TIME_IN_SECONDS='300' >> .env
            echo BASIC_AUTH_USER=${{secrets.BASIC_AUTH_USER}} >> .env
            echo BASIC_AUTH_PASSWORD=${{secrets.BASIC_AUTH_PASSWORD}} >> .env
            echo COMPOSE_HTTP_TIMEOUT=6000 >> .env
            cat .env
    - name: npm install, build 
      run: | 
            npm install --force --legacy-peer-deps
            npx drizzle-kit migrate
            npm run drizzle:seed
            npm run build
      working-directory: .

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: |
            .env
            .next
            package.json
            docker-compose.yml
            dockerfile
            public
            nginx
        include-hidden-files: true
        if-no-files-found: error
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: stop docker
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          port: 22
          script: | 
            cd app
            docker-compose stop nodejs

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: copy file via ssh password
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          source: "*"
          target: "~/app"

      - name: restart docker
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: | 
            cd app
            docker-compose restart nodejs
