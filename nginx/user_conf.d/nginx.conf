server {
    listen 80;
    listen [::]:80;

    server_name utilfacts.com www.utilfacts.com;
     location /.well-known/acme-challenge {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://utilfacts.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name utilfacts.com www.utilfacts.com;

    # Load the certificate files.
    ssl_certificate         /etc/letsencrypt/live/utilfacts.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/utilfacts.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/utilfacts.com/chain.pem;

    # Load the Diffie-Hellman parameter.
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;


  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://host.docker.internal:3000;
  }
}
